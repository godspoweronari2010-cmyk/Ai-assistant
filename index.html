<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Chat Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        header { margin-bottom: 20px; }
        #chat-area { height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
        #input-form { margin-top: 10px; }
        #settings-panel { margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>AI Assistant Chat Interface</h1>
    </header>
    <div id="chat-area"></div>
    <form id="input-form">
        <input type="text" placeholder="Type your message..." required />
        <button type="submit">Send</button>
    </form>
    <div id="settings-panel">
        <h2>Settings</h2>
        <label for="theme">Theme:</label>
        <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>
    <script>
        // JavaScript functionality can be added here
    </script>
</body>
</html>
