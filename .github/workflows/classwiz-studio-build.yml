name: Build ClassWiz Studio 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ClassWizStudio2/**'
      - '.github/workflows/classwiz-studio-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ClassWizStudio2
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassWiz-Studio-2.0-debug-APK
          path: ClassWizStudio2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
